<!doctype html>
<html lang="hi" style="background:#FBF6EC">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />

    <script type="application/ld+json">

        "alternateName": "शुभ वाटिका मैरिज लॉन",

        "telephone": "+91 98765 43210",
        "email": "booking@shubhvatika.example",
        "maximumAttendeeCapacity": 800,
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Plot 14, Kisan Path, Gomti Nagar Extension",
          "addressLocality": "Lucknow",
          "addressRegion": "Uttar Pradesh",
          "postalCode": "226010",
          "addressCountry": "IN"
        },
        "geo": { "@type": "GeoCoordinates", "latitude": 26.8467, "longitude": 81.0212 },

          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],

          "closes": "21:00"

          { "@type": "LocationFeatureSpecification", "name": "Parking", "value": "150 cars" },
          { "@type": "LocationFeatureSpecification", "name": "Guest rooms", "value": 12 },
          { "@type": "LocationFeatureSpecification", "name": "In-house kitchen", "value": true }

    <div id="root"></div>
